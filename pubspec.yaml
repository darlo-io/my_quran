name: quran_app
description: "Quran App - чтение, прослушивание и заучивание Корана"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  flutter:
    sdk: flutter

  # Material Design
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^17.2.3

  # Database
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.34
  path_provider: ^2.1.5
  path: ^1.9.1

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Serialization & Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Audio
  just_audio: ^0.9.43
  audio_service: ^0.18.17
  audio_session: ^0.1.25

  # Downloads
  flutter_downloader: ^1.11.8

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Preferences (UI only)
  shared_preferences: ^2.3.5

  # Localization
  slang: ^4.4.1
  slang_flutter: ^4.4.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_analytics: ^11.5.2
  firebase_crashlytics: ^4.3.5
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.2.2

  # Utilities
  equatable: ^2.0.7
  dartz: ^0.10.1
  intl: ^0.20.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.3
  package_info_plus: ^8.3.1
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  drift_dev: ^2.25.1

  # Testing
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/data/

  fonts:
    - family: Uthmanic
      fonts:
        - asset: assets/fonts/UthmanicHafs.otf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
